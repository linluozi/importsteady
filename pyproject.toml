[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "importsteady"
version = "0.1.0"
description = "Stable per-module import cost attribution over repeated cold starts"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "linluozi"}]
dependencies = []

[project.scripts]
importsteady = "importsteady.cli:main"

[tool.setuptools]
packages = ["importsteady"]

[tool.pytest.ini_options]
testpaths = ["tests"]
